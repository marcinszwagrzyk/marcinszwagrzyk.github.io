<!DOCTYPE html>
<meta charset="utf-8">
<title>route / land check</title>
<!--
  Headless check: does any sea lane cross land?

  It runs the real renderer geometry (geoPath from js/mapview.js) against the
  real boundaries (LAND from js/data/world-shapes.js), so what it tests is what
  the map draws. Land is rasterised into a canvas once and probed per pixel.

      powershell -ExecutionPolicy Bypass -File tools/check-routes.ps1
-->
<canvas id="c" width="4320" height="2160" style="display:none"></canvas>
<pre id="out">running</pre>

<script src="../js/data/world-shapes.js"></script>
<script src="../js/data/world.js"></script>
<script src="../js/data/routes.js"></script>
<script src="../js/mapview.js"></script>
<script>
const PPD = 12;                    // pixels per degree in the land raster
const EXEMPT = 0.75;               // degrees around an authored waypoint we do not police
const STEP = 0.08;                 // resample step along the drawn path, degrees

const cv = document.getElementById('c'), g = cv.getContext('2d', { willReadFrequently: true });
g.fillStyle = '#000'; g.fillRect(0, 0, cv.width, cv.height);
g.fillStyle = '#fff';
for (const { ring } of LAND) {
  g.beginPath();
  for (let i = 0; i < ring.length; i++) {
    const x = (ring[i][0] + 180) * PPD, y = (90 - ring[i][1]) * PPD;
    i ? g.lineTo(x, y) : g.moveTo(x, y);
  }
  g.closePath(); g.fill();
}
const img = g.getImageData(0, 0, cv.width, cv.height).data;

function isLand(lat, lon) {
  let l = lon;
  while (l < -180) l += 360;
  while (l >= 180) l -= 360;
  const x = Math.round((l + 180) * PPD), y = Math.round((90 - lat) * PPD);
  if (y < 0 || y >= cv.height) return false;
  return img[((y * cv.width) + (x % cv.width)) * 4] > 100;
}

// name lookup so a report points at waypoints, not bare coordinates
const NAME = new Map();
for (const k in WP) NAME.set(WP[k][0] + ',' + WP[k][1], k);
const nameOf = p => NAME.get(p[0] + ',' + p[1]) || `${p[0]},${p[1]}`;

function near(p, wps) {
  for (const w of wps) if (arcDeg(p, w) < EXEMPT) return true;
  return false;
}

/** Nearest authored leg, for a readable report. */
function legOf(p, wps) {
  let best = 0, bd = Infinity;
  for (let i = 0; i < wps.length - 1; i++) {
    const d = arcDeg(p, wps[i]) + arcDeg(p, wps[i + 1]) - arcDeg(wps[i], wps[i + 1]);
    if (d < bd) { bd = d; best = i; }
  }
  return nameOf(wps[best]) + ' -> ' + nameOf(wps[best + 1]);
}

function check(label, wps) {
  const path = geoPath(wps);
  const hits = new Map();
  for (let i = 1; i < path.length; i++) {
    const d = arcDeg(path[i - 1], path[i]);
    const n = Math.max(1, Math.ceil(d / STEP));
    for (let s = 0; s <= n; s++) {
      const p = arcAt(path[i - 1], path[i], s / n);
      if (!isLand(p[0], p[1]) || near(p, wps)) continue;
      const leg = legOf(p, wps);
      const cur = hits.get(leg);
      if (!cur) hits.set(leg, { n: 1, p });
      else cur.n++;
    }
  }
  return [...hits].map(([leg, h]) =>
    `${label}  ${leg}  (${(h.n * STEP).toFixed(1)} deg over land, e.g. ${h.p[0].toFixed(2)},${h.p[1].toFixed(2)})`);
}

const lines = [];
for (const r of ROUTES) {
  if (r.mode !== 'sea') continue;
  lines.push(...check(r.id + '/main', r.path));
  for (const a of (r.alts || [])) lines.push(...check(r.id + '/' + a.id, a.path));
}
document.getElementById('out').textContent =
  (lines.length ? lines.join('\n') : 'CLEAN') + `\n--- ${lines.length} crossings`;
</script>
