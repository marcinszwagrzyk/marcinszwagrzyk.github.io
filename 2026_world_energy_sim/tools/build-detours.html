<!DOCTYPE html>
<meta charset="utf-8">
<title>sea detour generator</title>
<!--
  Generates js/data/sea-detours.js and then verifies it: every sea leg is drawn
  exactly the way the map draws it (geoPath over the spliced path) and probed
  against the land raster. Run through tools/build-detours.ps1.
-->
<pre id="out">running</pre>

<script src="../js/data/world-shapes.js"></script>
<script src="../js/data/world.js"></script>
<script src="../js/data/routes.js"></script>
<script src="../js/mapview.js"></script>
<script src="searoute.js"></script>
<script>
const t0 = performance.now();
const router = new SeaRouter();
const legs = allSeaLegs();

const detours = {};
let routed = 0, failed = [];
for (const leg of legs) {
  const d = router.detour(leg.a, leg.b);
  if (d === null) continue;
  if (!Array.isArray(d) || !d.length) {
    failed.push(`${wpName(leg.a)} -> ${wpName(leg.b)}: ${(d && d.fail) || 'empty'}`);
    continue;
  }
  detours[leg.key] = d;
  routed++;
}

// ---- verify on the geometry the renderer will actually draw ----------------
function expand(path) {
  const out = [path[0]];
  for (let i = 1; i < path.length; i++) {
    const d = detours[legKey(path[i - 1], path[i])];
    if (d) for (const p of d) out.push(p);
    out.push(path[i]);
  }
  return out;
}

/** Nearest authored leg to a point, so a failure names waypoints. */
function legOf(p, wps) {
  let best = 0, bd = Infinity;
  for (let i = 0; i < wps.length - 1; i++) {
    const d = arcDeg(p, wps[i]) + arcDeg(p, wps[i + 1]) - arcDeg(wps[i], wps[i + 1]);
    if (d < bd) { bd = d; best = i; }
  }
  return best;
}

function verify(label, path) {
  const free = path.slice();
  const drawn = geoPath(expand(path));
  const bad = new Map();
  for (let i = 1; i < drawn.length; i++) {
    const n = Math.max(1, Math.ceil(arcDeg(drawn[i - 1], drawn[i]) / 0.08));
    for (let s = 0; s <= n; s++) {
      const p = arcAt(drawn[i - 1], drawn[i], s / n);
      if (!router.blocked(p[0], p[1], free)) continue;
      const l = legOf(p, path);
      if (isOnshore(path[l], path[l + 1])) continue;    // pipeline segments are meant to be dry
      const k = wpName(path[l]) + ' -> ' + wpName(path[l + 1]);
      if (!bad.has(k)) bad.set(k, p);
    }
  }
  return bad.size
    ? [...bad].map(([k, p]) => `${label}  ${k}  at ${p[0].toFixed(2)},${p[1].toFixed(2)}`)
    : [];
}

const problems = [];
for (const r of ROUTES) {
  if (r.mode !== 'sea') continue;
  problems.push(...verify(r.id + '/main', r.path));
  for (const a of (r.alts || [])) problems.push(...verify(r.id + '/' + a.id, a.path));
}

// ---- emit -------------------------------------------------------------------
const keys = Object.keys(detours).sort();
let js = `/**
 * Land-avoiding detours for the sea lanes - generated by tools/build-detours.ps1.
 * Do not edit by hand.
 *
 * Key is "lat,lon|lat,lon" of an authored leg; the value is the extra waypoints
 * the renderer splices in so the great circle between them stays at sea. The
 * points come from an A* through a 1/6 deg water raster, reduced to the fewest
 * that still clear land.
 */

const SEA_DETOURS = {
`;
for (const k of keys) {
  const pts = detours[k].map(p => `[${p[0]},${p[1]}]`).join(',');
  js += `  '${k}': [${pts}],\n`;
}
js += '};\n';

const report = [
  `legs ${legs.length}, rerouted ${routed}, no-path ${failed.length}`,
  ...failed,
  problems.length ? `STILL CROSSING (${problems.length}):` : 'VERIFY CLEAN',
  ...problems,
  `${((performance.now() - t0) / 1000).toFixed(1)}s`,
].join('\n');

document.getElementById('out').textContent =
  '===REPORT===\n' + report + '\n===FILE===\n' + js;
</script>
